<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a1c">
<title>Quét CCCD · iOS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  --bg:#0f1a1c; --panel:#172528; --line:#25393d; --text:#e8f1f0; --mute:#8fa8a8;
  --ok:#3ddc97; --warn:#ffb84d; --bad:#ff6b6b; --accent:#2fc4b2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;
  padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 18px)}
main{width:100%;max-width:460px;padding-top:12px}
h1{font-size:18px;font-weight:650;margin:2px 2px 10px;letter-spacing:.2px}

/* Camera */
.cam{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;
  background:#000;border:2px solid var(--line);transition:border-color .2s}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam canvas{display:none}
.frame{position:absolute;inset:18%;pointer-events:none;border-radius:10px;
  --c:rgba(255,255,255,.85);
  background:
   linear-gradient(var(--c),var(--c)) top left/22px 3px,
   linear-gradient(var(--c),var(--c)) top left/3px 22px,
   linear-gradient(var(--c),var(--c)) top right/22px 3px,
   linear-gradient(var(--c),var(--c)) top right/3px 22px,
   linear-gradient(var(--c),var(--c)) bottom left/22px 3px,
   linear-gradient(var(--c),var(--c)) bottom left/3px 22px,
   linear-gradient(var(--c),var(--c)) bottom right/22px 3px,
   linear-gradient(var(--c),var(--c)) bottom right/3px 22px;
  background-repeat:no-repeat}
.cam.warn{border-color:var(--warn)} .cam.warn .frame{--c:var(--warn)}
.cam.bad{border-color:var(--bad)}  .cam.bad .frame{--c:var(--bad)}
.cam.ok{border-color:var(--ok)}    .cam.ok .frame{--c:var(--ok)}
.cam-tools{position:absolute;right:10px;top:10px;display:flex;gap:8px}
.cam-tools button{border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;
  padding:8px 12px;font-size:13px;display:none}
.cam-tools button.on{background:var(--warn);color:#000}
.start{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:rgba(15,26,28,.92);font-size:14px;color:var(--mute)}
.start button{border:0;border-radius:12px;background:var(--accent);color:#04201c;
  font-weight:700;font-size:16px;padding:12px 22px}

/* Hint */
.hint{margin:10px 0 14px;padding:11px 14px;border-radius:12px;background:var(--panel);
  border-left:4px solid var(--mute);font-size:15px;line-height:1.35;min-height:46px}
.hint.warn{border-color:var(--warn)} .hint.bad{border-color:var(--bad)} .hint.ok{border-color:var(--ok)}

/* Results */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.row .lab{font-size:12px;color:var(--mute)}
.row .val{font-size:18px;font-weight:600;margin-top:1px;word-break:break-word;min-height:24px}
.row .val.empty{color:#4d6567;font-weight:400}
.row .txt{flex:1;min-width:0}
.copy{flex:none;border:1px solid var(--line);background:#1e3236;color:var(--text);
  border-radius:10px;padding:10px 14px;font-size:14px;min-width:84px}
.copy:disabled{opacity:.35}
.copy.done{background:var(--ok);color:#04201c;border-color:var(--ok)}

/* Actions */
.acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.act{display:flex;align-items:center;justify-content:space-between;text-decoration:none;
  color:var(--text);background:var(--accent);color:#04201c;font-weight:700;font-size:17px;
  border:0;border-radius:12px;padding:15px 16px;width:100%;text-align:left}
.act.sec{background:#e9c46a}
.act.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.act:active{transform:scale(.99)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);
  transform:translateX(-50%) translateY(20px);background:#000c;color:#fff;border-radius:999px;
  padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%)}
.top{display:flex;justify-content:space-between;align-items:center}
.back{color:var(--mute);font-size:14px;text-decoration:none;padding:6px 2px}
.res{position:absolute;left:10px;bottom:8px;font-size:11px;color:#fff9;pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.zoom button{border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;padding:7px 12px}
.zoom button.on{background:var(--accent);color:#04201c}
.cam video{transform-origin:center}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Quét QR CCCD · iOS</h1><a class="back" href="index.html">Đổi máy</a></div>

  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="work"></canvas>
    <div class="frame"></div>
    <div class="cam-tools"><button id="torch">Đèn</button></div>
    <div class="start" id="start">
      <div id="startMsg">Cho phép truy cập camera để quét mã QR trên CCCD.</div>
      <button id="startBtn">Bật camera</button>
    </div>
  </div>

  <div class="hint" id="hint">Đang khởi động camera…</div>

  <div class="rows">
    <div class="row">
      <div class="txt"><div class="lab">Số CCCD</div><div class="val empty" id="v-id">—</div></div>
      <button class="copy" data-t="v-id" disabled>Sao chép</button>
    </div>
    <div class="row">
      <div class="txt"><div class="lab">Họ và tên</div><div class="val empty" id="v-name">—</div></div>
      <button class="copy" data-t="v-name" disabled>Sao chép</button>
    </div>
    <div class="row">
      <div class="txt"><div class="lab">Ngày tháng năm sinh</div><div class="val empty" id="v-dob">—</div></div>
      <button class="copy" data-t="v-dob" disabled>Sao chép</button>
    </div>
  </div>

  <div class="acts">
    <a class="act" id="a-quick" target="_blank" rel="noopener"
       href="https://quanlyskcd.medinet.org.vn/app/main/dynamicreport/report/viewer-utility/KSKNCT_KiemTraNhanh_M11">
      <span>Tra cứu nhanh</span><span>›</span></a>
    <a class="act sec" id="a-bhyt" target="_blank" rel="noopener"
       href="https://baohiemxahoi.gov.vn/tracuu/Pages/tra-cuu-thoi-han-su-dung-the-bhyt.aspx">
      <span>Tra cứu BHYT</span><span>›</span></a>
    <button class="act ghost" id="redo"><span>Làm lại</span><span>↻</span></button>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), work = $('work'), ctx = work.getContext('2d', { willReadFrequently: true });
  const cam = $('cam'), hint = $('hint'), toastEl = $('toast');
  const small = document.createElement('canvas'); small.width = small.height = 32;
  const sctx = small.getContext('2d', { willReadFrequently: true });
  const resEl = document.createElement('div'); resEl.className = 'res'; cam.appendChild(resEl);

  let stream = null, track = null, scanning = false, loopId = 0;
  let lastLum = 0, lum = 128, startedAt = 0, lastInvalid = 0, current = null, ac = null, si = 0;

  function setHint(msg, level) { hint.textContent = msg; hint.className = 'hint ' + (level || ''); cam.className = 'cam ' + (level || ''); }
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 1400); }
  function unlockAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  document.addEventListener('touchend', unlockAudio, { once: true });

  /* ---------- Camera ---------- */
  async function startCamera() {
    unlockAudio();
    $('start').style.display = 'none';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext)
      return showStart('Cần mở bằng đường dẫn HTTPS (ví dụ GitHub Pages) để dùng camera.');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } }
      });
    } catch (e) {
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      return showStart(denied ? 'Chưa được cấp quyền camera. Vào Cài đặt › Chrome › Camera để cho phép, rồi bấm lại.'
                              : 'Không mở được camera: ' + (e && e.message || e));
    }
    track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    try { await video.play(); } catch (e) {}
    setupCaps();
    video.onloadedmetadata = video.onresize = () => { resEl.textContent = video.videoWidth + '×' + video.videoHeight; };
    resEl.textContent = video.videoWidth + '×' + video.videoHeight;
    if (typeof jsQR !== 'function' && !window.ZXing) { setHint('Không tải được thư viện quét — kiểm tra mạng rồi tải lại trang', 'bad'); return; }
    resumeScan();
  }
  function showStart(msg) { $('startMsg').textContent = msg; $('start').style.display = 'flex'; setHint('Camera chưa sẵn sàng', 'bad'); }
  $('startBtn').onclick = startCamera;
  let torchOn = false;
  $('torch').onclick = async () => {
    try { torchOn = !torchOn; await track.applyConstraints({ advanced: [{ torch: torchOn }] }); $('torch').classList.toggle('on', torchOn); }
    catch (e) { torchOn = false; }
  };

  /* ---------- Zoom & lấy nét ---------- */
  let zoomD = 1, zoomHW = null, manualZoom = false, lastZoomAt = 0, lastFocusAt = 0;
  const zb = document.createElement('div'); zb.className = 'zoom';
  zb.innerHTML = '<button data-z="1" class="on">1×</button><button data-z="2">2×</button><button data-z="3">3×</button>';
  cam.appendChild(zb);
  zb.querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); manualZoom = true; setZoom(+b.dataset.z); });

  function setupCaps() {
    try {
      const c = track.getCapabilities ? track.getCapabilities() : {};
      if (c.torch) $('torch').style.display = 'block';
      zoomHW = c.zoom && c.zoom.max > 1 ? { min: c.zoom.min || 1, max: c.zoom.max } : null;
    } catch (e) { zoomHW = null; }
    refocus();
  }
  function refocus() {
    lastFocusAt = performance.now();
    if (!track || !track.applyConstraints) return;
    try { track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); } catch (e) {}
  }
  async function setZoom(z) {
    lastZoomAt = performance.now();
    zb.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.z === z));
    if (zoomHW) {
      try {
        await track.applyConstraints({ advanced: [{ zoom: Math.min(zoomHW.max, Math.max(zoomHW.min, z)) }] });
        zoomD = 1; video.style.transform = ''; return;
      } catch (e) { zoomHW = null; }
    }
    zoomD = z; video.style.transform = z > 1 ? 'scale(' + z + ')' : '';
  }
  cam.addEventListener('click', refocus);

  /* ---------- Decoders ---------- */
  let zr = null, zh = null;
  function zxReady() {
    if (zr) return true;
    if (!window.ZXing) return false;
    try {
      zr = new ZXing.QRCodeReader();
      zh = new Map();
      zh.set(ZXing.DecodeHintType.TRY_HARDER, true);
      zh.set(ZXing.DecodeHintType.CHARACTER_SET, 'UTF-8');
    } catch (e) { zr = null; }
    return !!zr;
  }

  // Giãn tương phản (2%–98%) + chuyển xám + làm nét (unsharp): giúp QR nhỏ, mờ, thiếu sáng
  function enhance(d, w, h, sharp) {
    const n = w * h, hist = new Uint32Array(256); let g = new Uint8Array(n);
    for (let i = 0, j = 0; j < n; i += 4, j++) { const v = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8; g[j] = v; hist[v]++; }
    let lo = 0, hi = 255, a = 0; const t = n * .02;
    while (lo < 255 && (a += hist[lo]) < t) lo++;
    a = 0; while (hi > 0 && (a += hist[hi]) < t) hi--;
    const k = 255 / Math.max(1, hi - lo);
    for (let j = 0; j < n; j++) { const v = (g[j] - lo) * k; g[j] = v < 0 ? 0 : v > 255 ? 255 : v; }
    if (sharp) {
      const o = new Uint8Array(g);
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
        const i = y * w + x, v = 5 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
        o[i] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
      g = o;
    }
    for (let i = 0, j = 0; j < n; i += 4, j++) d[i] = d[i + 1] = d[i + 2] = g[j];
  }

  // Các chiến lược quét xoay vòng. crop = tỉ lệ vùng giữa khung (so với cạnh ngắn),
  // up = phóng to ảnh trước khi giải mã (cho QR nhỏ), enh = tăng tương phản, sharp = làm nét
  const STRATS = [
    { e: 'js', crop: .45, maxW: 1000 },
    { e: 'zx', crop: .45, maxW: 1000 },
    { e: 'js', crop: .3,  up: 2, enh: 1, sharp: 1 },
    { e: 'js', crop: .7,  maxW: 1000 },
    { e: 'zx', crop: .3,  up: 2, enh: 1 },
    { e: 'js', crop: 0,   maxW: 1100 },
    { e: 'js', crop: .45, maxW: 1000, enh: 1, inv: 1 },
    { e: 'zx', crop: 0,   maxW: 1280, enh: 1 },
    { e: 'js', crop: 0,   maxW: 640 }
  ];

  function fixUtf8(s) {
    try {
      if (!/[\u00c0-\u00ff]/.test(s)) return s;
      const b = Uint8Array.from(s, c => c.charCodeAt(0));
      if (Array.from(s).some(c => c.charCodeAt(0) > 255)) return s;
      return new TextDecoder('utf-8', { fatal: true }).decode(b);
    } catch (e) { return s; }
  }

  function attempt(st) {
    const vw = video.videoWidth, vh = video.videoHeight, m = Math.min(vw, vh);
    const crop = st.crop ? Math.min(1, st.crop / zoomD) : (zoomD > 1 ? 1 / zoomD : 0);
    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (crop) { sw = sh = Math.round(m * crop); sx = (vw - sw) / 2; sy = (vh - sh) / 2; }
    const scale = st.up ? Math.min(st.up, 1000 / sw) : Math.min(1, st.maxW / sw);
    const w = Math.round(sw * scale), h = Math.round(sh * scale);
    if (work.width !== w || work.height !== h) { work.width = w; work.height = h; }
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);

    if (st.e === 'js') {
      if (typeof jsQR !== 'function') return null;
      const img = ctx.getImageData(0, 0, w, h);
      if (st.enh) enhance(img.data, w, h, st.sharp);
      const r = jsQR(img.data, w, h, { inversionAttempts: st.inv ? 'attemptBoth' : 'dontInvert' });
      if (!r) return null;
      let text = r.data;
      try { if (r.binaryData) text = new TextDecoder('utf-8').decode(Uint8Array.from(r.binaryData)); } catch (e) {}
      return { text };
    }
    if (!zxReady()) return null;
    if (st.enh) { const img = ctx.getImageData(0, 0, w, h); enhance(img.data, w, h, st.sharp); ctx.putImageData(img, 0, 0); }
    try {
      const src = new ZXing.HTMLCanvasElementLuminanceSource(work);
      const r = zr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src)), zh);
      return r ? { text: r.getText() } : null;
    } catch (e) { return null; }
  }

  /* ---------- Vòng quét ---------- */
  function resumeScan() {
    current = null; scanning = true; startedAt = performance.now();
    manualZoom = false; setZoom(1); refocus();
    video.play().catch(() => {});
    setHint('Đưa mã QR trên CCCD vào khung', '');
    loop(++loopId);
  }

  async function loop(id) {
    while (scanning && id === loopId) {
      await new Promise(r => requestAnimationFrame(r));
      if (video.readyState < 2 || !video.videoWidth) continue;
      const t = performance.now();
      measureLight(t);
      let r = null;
      try { r = attempt(STRATS[si++ % STRATS.length]); } catch (e) {}
      if (!scanning || id !== loopId) return;
      if (r && r.text) handleQR(r.text, t); else idleHint(t);
    }
  }

  function measureLight(t) {
    if (t - lastLum < 300) return; lastLum = t;
    try {
      sctx.drawImage(video, 0, 0, 32, 32);
      const d = sctx.getImageData(0, 0, 32, 32).data; let s = 0;
      for (let i = 0; i < d.length; i += 4) s += d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
      lum = s / (d.length / 4);
    } catch (e) {}
  }

  function idleHint(t) {
    if (t - lastFocusAt > 2500) refocus();
    const s = (t - startedAt) / 1000;
    if (!manualZoom && s > 3 && t - lastZoomAt > 3000) setZoom(zoomHW ? (lastZ = lastZ % 3 + 1) : (lastZ = lastZ % 3 + 1));
    if (t - lastInvalid < 1500 && lastInvalid) return;
    if (lum < 55) return setHint('Quá tối — bật đèn hoặc di chuyển ra chỗ sáng hơn', 'bad');
    if (lum > 215) return setHint('Quá sáng/chói — nghiêng thẻ để tránh phản chiếu', 'warn');
    if (s > 3) return setHint('Giữ thẻ cách camera 15–20 cm cho nét, giữ yên. Đang tự phóng to (' + (zoomD > 1 ? zoomD : (zb.querySelector('.on') || {}).dataset.z) + '×)', 'warn');
    setHint('Đưa mã QR trên CCCD vào khung', '');
  }
  let lastZ = 1;

  function handleQR(text, t) {
    const d = parseCCCD(fixUtf8(String(text)));
    if (!d) { lastInvalid = t; setHint('Mã QR này không phải QR của CCCD', 'warn'); return; }
    success(d);
  }

  /* ---------- Phân tích dữ liệu ---------- */
  function parseCCCD(text) {
    const p = String(text).split('|').map(s => s.trim());
    if (p.length < 4 || !/^\d{9,12}$/.test(p[0])) return null;
    let dob = p[3];
    if (/^\d{8}$/.test(dob)) dob = dob.slice(0, 2) + '/' + dob.slice(2, 4) + '/' + dob.slice(4);
    return { id: p[0], name: p[2], dob };
  }

  function success(d) {
    scanning = false; loopId++; current = d;
    video.pause();
    set('v-id', d.id); set('v-name', d.name); set('v-dob', d.dob);
    document.querySelectorAll('.copy').forEach(b => b.disabled = false);
    setHint('Đã quét xong — bấm Sao chép hoặc Tra cứu', 'ok');
    beep();
  }
  function set(id, v) { const e = $(id); e.textContent = v || '—'; e.classList.toggle('empty', !v); }
  function beep() {
    try {
      unlockAudio();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 1100; g.gain.value = .08; o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + .09);
    } catch (e) {}
  }

  /* ---------- Sao chép & thao tác ---------- */
  async function copyText(s) {
    try { await navigator.clipboard.writeText(s); return true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = s; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove(); return ok;
    }
  }
  document.querySelectorAll('.copy').forEach(b => b.onclick = async () => {
    const v = $(b.dataset.t).textContent;
    if (!v || v === '—') return;
    if (await copyText(v)) {
      b.textContent = 'Đã chép'; b.classList.add('done');
      setTimeout(() => { b.textContent = 'Sao chép'; b.classList.remove('done'); }, 1200);
    } else toast('Không sao chép được');
  });
  ['a-quick', 'a-bhyt'].forEach(id => $(id).addEventListener('click', () => { if (current) copyText(current.id); }));

  $('redo').onclick = () => {
    set('v-id', ''); set('v-name', ''); set('v-dob', '');
    document.querySelectorAll('.copy').forEach(b => b.disabled = true);
    if (stream && track && track.readyState === 'live') resumeScan(); else startCamera();
  };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { scanning = false; loopId++; return; }
    if (!stream || current) return;
    if (track && track.readyState === 'ended') { stream = null; startCamera(); } else resumeScan();
  });

  startCamera();
})();
</script>
</body>
</html>
