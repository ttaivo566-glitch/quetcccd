<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a1c">
<title>Quét CCCD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0f1a1c;color:#e8f1f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:420px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 22px;color:#8fa8a8;font-size:15px}
a{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#e8f1f0;
  background:#172528;border:2px solid #25393d;border-radius:16px;padding:20px 18px;margin-bottom:12px;font-size:20px;font-weight:650}
a small{display:block;font-weight:400;font-size:13px;color:#8fa8a8;margin-top:3px}
a.rec{border-color:#2fc4b2}
a.rec::after{content:"Đúng máy này";font-size:12px;font-weight:700;background:#2fc4b2;color:#04201c;border-radius:999px;padding:4px 10px}
a:active{transform:scale(.99)}
</style>
</head>
<body>
<main>
  <h1>Quét QR CCCD</h1>
  <p>Bạn đang dùng điện thoại nào?</p>
  <a id="ios" href="ios.html"><span>iPhone / iPad<small>iOS</small></span></a>
  <a id="android" href="android.html"><span>Android<small>Samsung, Xiaomi, Oppo, …</small></span></a>
</main>
<script>
(function () {
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAnd = /Android/i.test(ua);
  var el = document.getElementById(isIOS ? 'ios' : isAnd ? 'android' : '');
  if (el) { el.classList.add('rec'); el.parentNode.insertBefore(el, el.parentNode.children[2]); }
})();
</script>
</body>
</html>
